name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/readme/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check_docs_links.mjs'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/readme/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check_docs_links.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select GitHub Pages base
        shell: bash
        env:
          DOCS_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          if [[ "$DOCS_REPOSITORY" == *.github.io ]]; then
            echo 'DOCS_BASE=/' >> "$GITHUB_ENV"
          else
            echo "DOCS_BASE=/$DOCS_REPOSITORY/" >> "$GITHUB_ENV"
          fi
      - run: npm run docs:build
      - run: npm run docs:check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
