    heartbeat_create_job: allow
    heartbeat_update_job: allow
    heartbeat_delete_job: allow
    heartbeat_toggle_job: allow
    heartbeat_preview_job: allow
    heartbeat_run_now: allow
    heartbeat_cancel_run: allow
    acp_chat: ask
  rules:
  - id: shell_allow_dir
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: dir *
    severity: LOW
  - id: shell_allow_ls
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: ls *
    severity: LOW
  - id: shell_allow_pwd
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: pwd *
    severity: LOW
  - id: shell_allow_cd
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: cd *
    severity: LOW
  - id: shell_allow_echo
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: echo *
    severity: LOW
  - id: shell_allow_cat
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: cat *
    severity: LOW
  - id: shell_allow_type
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: type *
    severity: LOW
  - id: shell_allow_head
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: head *
    severity: LOW
  - id: shell_allow_tail
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: tail *
    severity: LOW
  - id: shell_allow_git_status
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: git status *
    severity: LOW
  - id: shell_allow_git_log
    tools:
    - bash
    - powershell
    - mcp_exec_command
    - create_terminal
    pattern: git log *
    severity: LOW
  - id: shell_allow_git_diff
    tools:
