config_version: ''
preferred_language: zh
progressive_tool_enabled: true
progressive_tool_optimize: false
setup_guide:
  enabled: true
auto_recap:
  enabled: true
a2ui:
  enabled: false
  protocol_version: '0.8'
  stream_validation_enabled: true
  non_web_fallback_enabled: false
  dev_smoke_tools_enabled: false
rsi:
  enabled: false
a4p:
  enabled: false
symphony:
  enabled: false
  paths:
    skills_root: ''
    graph_dir: ''
  fingerprint:
    scan:
      max_depth: null
    extraction:
      workers: 4
      batch_size: 2
      body_limit: null
  build:
    workers: 4
    batch_size: 16
    max_candidates_per_skill_relation: 32
    require_consensus: false
    min_edge_confidence: 0.5
  evolution:
    flow:
      enabled: null
      min_successes: 3
      min_pack_success_rate: 0.8
  orchestration:
    mode: fast
    top_k: 3
    max_depth: 4
    min_edge_confidence: 0.5
  skill_retrieval:
    enabled: false
    artifact_root: ${SYMPHONY_SKILL_RETRIEVAL_ROOT:-}
    discovery:
      max_output_chars: 12000
      incremental_notice_max_chars: 4000
      prompt_preferred_skills:
      - skill-creator
      - swarmskill-creator
      - symphony-assistant
    build:
      preserve_previous_index_on_failure: true
      max_depth: 6
      branching_factor: 128
      max_workers: 2
      max_retries: 2
      request_timeout_seconds: 420.0
      classification_batch_limit: 32
      root_categories: null
      discovery_seed: 42
      postprocess_enabled: true
      postprocess_max_passes: 1
      postprocess_min_skills: 6
      equivalence_enabled: false
    llm: null
auto_memory_enabled: false
logging:
  level: INFO
  console_level: INFO
  gateway: INFO
  channel: INFO
  agent_server: INFO
  full: INFO
memory:
  mode: ${MEMORY_MODE:-local}
  engine: none
  builtin:
    provider: ''
    jiuwen:
      mode: ${JIUWEN_MEMORY_MODE:-sdk}
      base_url: ${JIUWEN_MEMORY_BASE_URL:-http://127.0.0.1:8137}
      api_key: ${JIUWEN_MEMORY_API_KEY:-}
      user_id: ${MEMORY_USER_ID:-__default__}
      scope_id: ${MEMORY_SCOPE_ID:-__default__}
      session_id: ''
      agent_id: jiuwenswarm
      space: ''
      identity_org: local
      identity_user: developer
      session_end_extract: false
      sdk:
        globals:
          embedder_dim: 1024
          llm_base_url: ''
          llm_api_key: ''
          llm_model: ''
          llm_temperature: 0.0
          llm_max_tokens: 4096
          embedder_base_url: ''
          embedder_api_key: ''
          embedder_model: ''
        markdown_store:
          default:
            target: local
            params:
              root: ''
  forbidden_memory_definition:
    enabled: false
    patterns: []
    description:
      zh: 以下内容禁止记忆：（用户自行补充，如身高、体重、姓名等，建议用逗号分隔）
      en: 'The following content is forbidden to remember: (To be supplemented by
        users, e.g., height, weight, name, etc. Separate items with commas recommended)'
  external:
    provider: ${MEMORY_EXTERNAL_PROVIDER:-}
    user_id: ${MEMORY_USER_ID:-__default__}
    scope_id: ${MEMORY_SCOPE_ID:-__default__}
    openjiuwen:
      kv_type: shelve
      kv_path: ${MEMORY_KV_PATH:-}
      vector_type: chroma
      vector_persist_dir: ${MEMORY_VECTOR_DIR:-}
      db_type: sqlite
      db_path: ${MEMORY_DB_PATH:-}
    mem0:
      api_key: ${MEM0_API_KEY:-}
      user_id: ${MEM0_USER_ID:-jiuwenswarm-user}
      agent_id: ${MEM0_AGENT_ID:-jiuwenswarm}
      rerank: true
    openviking:
      endpoint: ${OPENVIKING_ENDPOINT:-http://127.0.0.1:1933}
      api_key: ${OPENVIKING_API_KEY:-}
      account: ${OPENVIKING_ACCOUNT:-root}
      user: ${OPENVIKING_USER:-default}
    lakebase:
      api_key: ${LAKEBASE_API_KEY:-}
      base_url: ${LAKEBASE_API_URL:-}
      base_id: ${LAKEBASE_MEM_BASE_ID:-}
      database_id: ${LAKEBASE_DATABASE_ID:-}
    jiuwen:
      mode: ${JIUWEN_MEMORY_MODE:-server}
      tenant_id: ${JIUWEN_MEMORY_TENANT_ID:-default}
      infer_turns: true
      save_assistant_turns: false
      server:
        base_url: ${JIUWEN_MEMORY_BASE_URL:-http://127.0.0.1:8137}
        api_key: ${JIUWEN_MEMORY_API_KEY:-}
        read_timeout: 30.0
        write_timeout: 120.0
      sdk:
        kv_type: ${JIUWEN_KV_TYPE:-redis}
        kv_url: ${JIUWEN_KV_URL:-redis://localhost:6379/0}
        vector_type: ${JIUWEN_VECTOR_TYPE:-milvus}
        vector_url: ${JIUWEN_VECTOR_URL:-http://localhost:19530}
        db_type: ${JIUWEN_DB_TYPE:-elasticsearch}
        db_url: ${JIUWEN_DB_URL:-http://localhost:9200}
        embedder_dim: ${JIUWEN_EMBEDDER_DIM:-1024}
proactive_recommendation:
  enabled: false
  max_recommend_per_day: 10
  max_rounds_per_tick: 20
endpoint_profile_overrides: null
models:
  defaults:
  - model_id: mdl_default_primary
    model_client_config:
      api_base: ${API_BASE}
      api_key: ${API_KEY}
      model_name: ${MODEL_NAME}
      client_provider: ${MODEL_PROVIDER}
      endpoint_profile: ${ENDPOINT_PROFILE:-openai}
      timeout: 360
      stream_first_chunk_timeout: 300
      stream_idle_timeout: 120
      verify_ssl: true
      custom_headers: {}
    model_config_obj: {}
    is_default: true
  agentos: null
  video:
    model_client_config:
      api_base: ${VIDEO_API_BASE}
      api_key: ${VIDEO_API_KEY}
      model_name: ${VIDEO_MODEL_NAME}
      client_provider: ${VIDEO_PROVIDER}
      endpoint_profile: ${VIDEO_ENDPOINT_PROFILE:-openai_compatible}
      timeout: 1800
      verify_ssl: true
    model_config_obj: {}
  audio:
    model_client_config:
      api_base: ${AUDIO_API_BASE}
      api_key: ${AUDIO_API_KEY}
      model_name: ${AUDIO_MODEL_NAME}
      client_provider: ${AUDIO_PROVIDER}
      endpoint_profile: ${AUDIO_ENDPOINT_PROFILE:-openai_compatible}
      verify_ssl: true
      timeout: 1800
    model_config_obj: {}
  vision:
    model_client_config:
      api_base: ${VISION_API_BASE}
      api_key: ${VISION_API_KEY}
      model_name: ${VISION_MODEL_NAME}
      client_provider: ${VISION_PROVIDER}
      endpoint_profile: ${VISION_ENDPOINT_PROFILE:-openai_compatible}
      verify_ssl: true
      timeout: 1800
    model_config_obj: {}
  image_gen:
    model_client_config:
      api_base: ${IMAGE_GEN_API_BASE}
      api_key: ${IMAGE_GEN_API_KEY}
      model_name: ${IMAGE_GEN_MODEL_NAME}
      client_provider: ${IMAGE_GEN_PROVIDER}
      endpoint_profile: ${IMAGE_GEN_ENDPOINT_PROFILE:-dashscope}
      verify_ssl: true
      timeout: 1800
    model_config_obj: {}
  group_routing_timeout_seconds: ${JIUWENSWARM_MODEL_GROUP_TIMEOUT_SECONDS:-360}
  group_stream_first_chunk_timeout_seconds: ${JIUWENSWARM_MODEL_GROUP_STREAM_FIRST_CHUNK_TIMEOUT_SECONDS:-300}
  group_stream_idle_timeout_seconds: ${JIUWENSWARM_MODEL_GROUP_STREAM_IDLE_TIMEOUT_SECONDS:-120}
  groups: []
acp_agents:
  codex:
    command: npx
    args:
    - '@zed-industries/codex-acp@latest'
    cwd: null
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
agents:
  agent_leader:
    workspace:
      stable_base: true
    completion_timeout: 6000.0
  agent_teammate:
    workspace:
      stable_base: true
    max_iterations: 200
    completion_timeout: 6000.0
telemetry:
  enabled: false
  exporter: otlp
  endpoint: http://localhost:4317
  protocol: grpc
  headers: null
  log_messages: true
  service_name: jiuwenswarm
  provider_factory: null
  traces:
    exporter: null
    endpoint: null
    protocol: null
    headers: null
  metrics:
    exporter: null
    endpoint: null
    protocol: null
    headers: null
agent_observability:
  enabled: false
  exporter: file
  endpoint: http://localhost:4317
  service_name: jiuwenswarm-agent
  sample_rate: 1.0
  redact_prompts: false
  redact_completions: false
  attribute_value_max_length: 10240
  langfuse_public_key: ''
  langfuse_secret_key: ''
  traces_dir: ''
  file_retention_days: 7
session_cleanup:
  retention_days: 30
trajectory_ui:
  enabled: false
  diagnosis_enabled: false
  db_path: ''
  retention_days: 7
  queue_size: 4096
  batch_size: 64
  flush_interval_ms: 200
  detail_max_bytes: 4194304
  discard_final_span_frames: true
experimental:
  team_organization_ui_enabled: false
  comfyui_workflow_enabled: false
  task_full_duplex_enabled: false
  task_asr_enabled: false
debug_trace:
  agent:
    enabled: false
    dump_enabled: true
    otel_enabled: false
    include_model_output: true
    include_reasoning: true
    include_tool_args: true
    include_tool_result: true
    include_subagent_flow: true
  code:
    enabled: false
    dump_enabled: true
    otel_enabled: false
    include_model_output: true
    include_reasoning: true
    include_tool_args: true
    include_tool_result: true
    include_subagent_flow: true
  limits:
    tool_args_max_chars: 2000
    tool_result_max_chars: 8000
    generic_payload_max_chars: 4000
    max_model_output_chars: null
  redaction:
    redact_prompts: false
    redact_completions: false
kv_cache_affinity_config:
  enable_kv_cache_affinity: false
react:
  agent_name: main_agent
  enable_task_loop: true
  enable_read_image_multimodal: null
  completion_timeout: null
  model_name: ${MODEL_NAME}
  skill_mode: all
  subagents:
    statusline-setup:
      enabled: true
      max_iterations: 15
    general_agent:
      enabled: true
    code_agent:
      enabled: false
    research_agent:
      enabled: false
    browser_agent:
      enabled: true
    cua_agent:
      enabled: null
      pause_on_user_input: false
  subagent_runtime:
    enabled: true
  answer_chunk_size: 500
  stream_chunk_threshold: 50
  stream_character_threshold: 2000
  context_engine_config:
    enabled: true
    enable_openrouter_model_context_window_tokens: false
    enable_tiktoken_counter: false
    tokenizer_cache_dir: tokenizers
    tokenizer_offline: false
    enable_context_debug: false
    enable_reload: true
    compression_recall_config:
      enabled: false
      chunk_size_tokens: 3000
      chunk_overlap_tokens: 500
    message_summary_offloader_config:
      protected_tool_names:
      - read_file
      - read_pdf
      add_message_threshold_ratio: 0.1
      ttl_seconds: 300
      ttl_context_occupancy_ratio: 0.5
      ttl_message_threshold_ratio: 0.05
    session_memory_compressor_config:
      enabled: false
      trigger_context_ratio: 0.8
      memory:
        update_trigger_context_ratio: 0.1
    dialogue_compressor_config:
      trigger_context_ratio: 0.8
      min_target_context_ratio: 0.1
    current_round_compressor_config:
      trigger_context_ratio: 0.8
      min_target_context_ratio: 0.1
      keep_recent_messages: 4
    round_level_compressor_config:
      trigger_context_ratio: 0.8
      min_target_context_ratio: 0.1
      keep_recent_messages: 0
  evolution:
    skill_evolution: false
    auto_save: false
    review_feedback_min_confidence: 0.7
  ttse:
    enabled: false
    evolve_enabled: true
    inject_enabled: true
    dream_enabled: true
    consult_top_k: 8
    consult_retrieve_mode: hybrid
    embedding:
      api_key: ${EMBED_API_KEY}
      base_url: ${EMBED_API_BASE}
      model: ${EMBED_MODEL}
  a2x_registry:
    base_url: http://127.0.0.1:8000
    timeout: 30.0
    api_key: ''
    ownership_file: null
    role: teammate
    dataset: team_pool
    endpoint: ''
tools:
- todo
- skill
email_settings:
  email_address: ${EMAIL_ADDRESS}
  token: ${EMAIL_TOKEN}
  smtp_server: ${SMTP_SERVER:-smtp.gmail.com}
  port: ${EMAIL_PORT:-587}
embed:
  embed_api_key: ${EMBED_API_KEY}
  embed_base_url: ${EMBED_API_BASE}
  embed_model: ${EMBED_MODEL}
task_memory:
  enabled: true
  llm_model: ${TASK_MEMORY_LLM_MODEL}
  embedding_model: ${TASK_MEMORY_EMBED_MODEL}
  api_key: ${TASK_MEMORY_API_KEY}
  api_base: ${TASK_MEMORY_API_BASE}
  retrieval_algo: ACE
  summary_algo: ACE
redis:
  mode: ${REDIS_MODE:-standalone}
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  username: ${REDIS_USER:-}
  db: ${REDIS_DB:-0}
  key_prefix: ${REDIS_KEY_PREFIX:-jiuwenclaw:}
  pool_size: ${REDIS_POOL_SIZE:-10}
  connect_timeout: ${REDIS_CONNECT_TIMEOUT:-5}
  operation_timeout: ${REDIS_OPERATION_TIMEOUT:-10}
  health_check_interval: ${REDIS_HEALTH_CHECK_INTERVAL:-30}
gateway:
  deployment_mode: ${DEPLOYMENT_MODE:-standalone}
  instance_id: ${GATEWAY_INSTANCE_ID:-}
  session_map_scope: per_chat_bot
  cron:
    store_backend: ${CRON_STORE_BACKEND:-file}
    etcd_endpoints: null
    etcd_prefix: /jiuwenswarm/cron/jobs/
  agent_client:
    type: websocket
    frontend_endpoint: null
    function_version_urn: null
    concurrency: 1
    invoke_timeout_s: 60
    agent_timeout_s: 300
    agent_namespace: default
  agentos:
    creating_timeout_seconds: 60
    wait_running_timeout_seconds: 90
    wait_running_interval_seconds: 1
    probes:
      startup:
        initial_delay_seconds: 3
        period_seconds: 3
        timeout_seconds: 2
        failure_threshold: 6
      liveness:
        timeout_seconds: 2
        failure_threshold: 3
    workspace_root: /home/agentos/users
    agent_key_fields:
    - user_id
    - agent_type
    connect_warmup_enabled: true
    sandbox_idle_timeout_seconds: 600
    sandbox_idle_check_interval_seconds: 30
    disconnect_cleanup_timeout_seconds: 60
    registry:
      endpoint: null
      request_timeout_s: 10
      node: null
    ssh:
      port: 2222
      user_template: yr:instance:{instance}:port=2222
      connect_timeout_s: 30
      client_keys_dir: /root/.ssh
    auth_service_url: ${AGENTOS_AUTH_SERVICE_URL:-http://iam-agentos:8090}
    timeout: ${AGENTOS_AUTH_TIMEOUT:-10}
    auth_enabled: false
heartbeat:
  jobs:
    min_interval_seconds: 60
    max_active_jobs_per_session: 5
    max_active_jobs_global: 100
    default_max_runs: 12
    default_concurrency_policy: skip
    default_session_deleted_policy: disable
    execution_timeout_seconds: 300
    user_preemption_timeout_seconds: 10
health_check:
  every: 3600
  target: web
  active_hours:
    start: 08:00
    end: 1320
execution_guard:
