# Copy to a *.local.yaml; fill corpus_path and both role credentials.
# Native HF questions require authorized access (HF_TOKEN in the environment).
# To reuse a complete native CSV cache, explicitly set benchmark.data_path.
run:
  output_dir: ../runs
benchmark:
  name: officeqa_pro
  corpus_path: /absolute/path/to/public/corpus
  seed: 42
  # Custom experiment partition; not an official native train/dev/test split.
  split_counts: {train: 1, dev: 1, test: 1}
agent:
  name: miniagent
  max_turns: 8
  timeout: 600
  llm:
    model_name: deepseek-flash
    base_url: https://api.deepseek.com
    api_key:
algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  worker:
    type: llm
    timeout: 600
    llm:
      model_name: deepseek-flash
      base_url: https://api.deepseek.com
      api_key:
