run:
  output_dir: ./runs/evoprompt-miniagent-searchqa
benchmark:
  name: searchqa
  split: auto
  seed: 42
  data_path: ./data/searchqa
agent:
  name: miniagent
  llm:
    model_name: deepseek-v4-flash
    base_url: https://api.deepseek.com
    max_tokens: 16384
    reasoning_effort: high
    llm_max_retries: 1
  timeout: 300
  max_turns: 10
  source_dir: ./harnesses/evoprompt-miniagent-searchqa/target
algorithm:
  name: evoprompt
  worker:
    type: agent
    llm:
      model_name: deepseek-v4-pro
      base_url: https://api.deepseek.com
      max_tokens: 32768
      reasoning_effort: high
      llm_max_retries: 1
    timeout: 600
    max_retries: 1
    name: miniagent
    max_turns: 10
    source_dir: ./harnesses/evoprompt-miniagent-searchqa/worker
  variant: de
  population_size: 6
  max_steps: 5
  selection: wheel
  survivor_selection: topk
  donor_random: false
  seed: 42
