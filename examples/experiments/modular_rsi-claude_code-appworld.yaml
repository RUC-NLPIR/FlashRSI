run:
  output_dir: ./runs/modular_rsi-claude_code-appworld
  seed: 42
benchmark:
  name: appworld
  split: auto
  data_path: ./data/appworld/split-manifest.json
  seed: 42
agent:
  name: claude_code
  llm:
    model_name: deepseek-flash
    base_url: https://api.deepseek.com/anthropic
    max_tokens: 8192
    effort: high
    max_retries: 1
  source_dir: ./harnesses/modular_rsi-claude_code-appworld/target
  timeout: 600
  max_turns: 30
  tools:
  - Read
  - Glob
  - Grep
  - Skill
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - mcp__appworld__appworld_execute
algorithm:
  name: modular_rsi
  worker:
    type: agent
    llm:
      model_name: deepseek-v4-pro
      base_url: https://api.deepseek.com/anthropic
      max_tokens: 65536
      reasoning_effort: high
      max_retries: 1
      effort: high
    name: claude_code
    source_dir: ../../flashrsi/agents/claude_code
    max_turns: 100
    timeout: 1200
  evolution_data_policy: benchmark_train
  modules:
    solving_strategy:
    - skills/appworld/SKILL.md
    tool_interaction:
    - hooks/tool_interaction.py
    completion_check:
    - hooks/completion_check.py
  num_epochs: 1
  integration_epochs: 1
  batch_size: 40
  num_rollouts: 2
  validation_samples: 2
  edit_budget: 1
  seed: 42
  max_evidence_chars: 60000
  review_evidence_chars: 120000
