run:
  output_dir: ./runs/ace-miniagent-hotpotqa
benchmark:
  name: hotpotqa
  split: auto
  data_path: ./data/hotpotqa
  seed: 42
agent:
  name: miniagent
  llm:
    model_name: deepseek-flash
    base_url: https://api.deepseek.com
    max_tokens: 32768
    reasoning_effort: high
    llm_max_retries: 1
  timeout: 600
  max_turns: 10
  source_dir: ./harnesses/ace-miniagent-hotpotqa/target
algorithm:
  name: ace
  worker:
    type: agent
    llm:
      model_name: deepseek-v4-pro
      base_url: https://api.deepseek.com
      max_tokens: 65536
      reasoning_effort: high
      llm_max_retries: 1
    timeout: 900
    max_retries: 1
    name: miniagent
    max_turns: 10
    source_dir: ./harnesses/ace-miniagent-hotpotqa/worker
  mode: offline
  num_epochs: 1
  batch_size: 1
  max_steps: null
  edit_budget: 4
  eval_steps: 100
  max_reflection_rounds: 3
  curator_frequency: 1
  playbook_token_budget: 8000
  success_threshold: 1.0
  max_evidence_chars: 24000
  seed: 42
