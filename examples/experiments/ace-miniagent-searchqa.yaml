run:
  output_dir: ./runs/ace-miniagent-searchqa
benchmark:
  name: searchqa
  split: auto
  seed: 42
  data_path: ./data/searchqa
agent:
  name: miniagent
  llm:
    model_name: deepseek-v4-flash
    base_url: https://api.deepseek.com
    max_tokens: 16384
    reasoning_effort: high
    llm_max_retries: 1
  timeout: 300
  max_turns: 10
  source_dir: ./harnesses/ace-miniagent-searchqa/target
algorithm:
  name: ace
  worker:
    type: agent
    llm:
      model_name: deepseek-v4-pro
      base_url: https://api.deepseek.com
      max_tokens: 32768
      reasoning_effort: high
      llm_max_retries: 1
    timeout: 600
    max_retries: 1
    name: miniagent
    max_turns: 10
    source_dir: ./harnesses/ace-miniagent-searchqa/worker
  mode: offline
  num_epochs: 1
  batch_size: 1
  max_steps: null
  edit_budget: 4
  eval_steps: 100
  max_reflection_rounds: 3
  curator_frequency: 1
  playbook_token_budget: 8000
  success_threshold: 1.0
  max_evidence_chars: 24000
  seed: 42
