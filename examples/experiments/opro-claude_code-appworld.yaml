run:
  output_dir: ./runs/opro-claude_code-appworld
  seed: 42
benchmark:
  name: appworld
  split: auto
  seed: 42
  data_path: ./data/appworld/split-manifest.json
agent:
  name: claude_code
  llm:
    model_name: deepseek-flash
    base_url: https://api.deepseek.com/anthropic
    max_tokens: 8192
    effort: high
    max_retries: 1
  source_dir: ./harnesses/opro-claude_code-appworld/target
  timeout: 600
  max_turns: 30
  tools:
  - Read
  - Glob
  - Grep
  - Skill
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - mcp__appworld__appworld_execute
algorithm:
  name: opro
  worker:
    type: llm
    llm:
      model_name: deepseek-v4-pro
      base_url: https://api.deepseek.com
      max_tokens: 65536
      reasoning_effort: high
    timeout: 900
    max_retries: 1
  max_steps: 5
  num_candidates: 4
  history_size: 20
  score_threshold: 0.1
  few_shot_size: 3
  max_evidence_chars: 24000
  seed: 42
