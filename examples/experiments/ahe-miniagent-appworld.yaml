run:
  output_dir: ./runs/ahe-miniagent-appworld
  seed: 42
benchmark:
  name: appworld
  split: auto
  seed: 42
  data_path: ./data/appworld/split-manifest.json
agent:
  name: miniagent
  llm:
    model_name: deepseek-flash
    base_url: https://api.deepseek.com
    max_tokens: 8192
    max_retries: 1
    reasoning_effort: high
  timeout: 600
  max_turns: 30
  source_dir: ./harnesses/ahe-miniagent-appworld/target
algorithm:
  name: ahe
  worker:
    type: agent
    llm:
      model_name: deepseek-v4-pro
      base_url: https://api.deepseek.com
      max_tokens: 65536
      reasoning_effort: high
    timeout: 900
    max_retries: 1
    name: miniagent
    max_turns: 10
    source_dir: ./harnesses/ahe-miniagent-appworld/worker
  max_steps: 5
  target_score: 1.0
  use_debugger: true
  debugger_max_tasks: 10
  max_evidence_chars: 30000
