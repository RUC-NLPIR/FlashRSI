run:
  output_dir: ./runs/adas-claude_code-hotpotqa
  seed: 42
benchmark:
  name: hotpotqa
  split: auto
  seed: 42
  data_path: ./data/hotpotqa
agent:
  name: claude_code
  llm:
    model_name: deepseek-v4-flash
    base_url: https://api.deepseek.com/anthropic
    max_tokens: 32768
    reasoning_effort: high
    max_retries: 1
    effort: high
  source_dir: ./harnesses/adas-claude_code-hotpotqa/target
  timeout: 600
  max_turns: 10
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
algorithm:
  name: adas
  worker:
    type: agent
    llm:
      model_name: deepseek-v4-pro
      base_url: https://api.deepseek.com/anthropic
      max_tokens: 65536
      reasoning_effort: high
      max_retries: 1
      effort: high
    name: claude_code
    timeout: 1200
    max_turns: 100
    source_dir: ../../flashrsi/agents/claude_code
  max_steps: 10
  num_reflections: 2
  max_evidence_chars: 30000
