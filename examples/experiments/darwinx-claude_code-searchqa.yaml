run:
  output_dir: ./runs/darwinx-claude_code-searchqa
  seed: 42
benchmark:
  name: searchqa
  split: auto
  data_path: ./data/searchqa
agent:
  name: claude_code
  llm:
    model_name: deepseek-v4-flash
    base_url: https://api.deepseek.com/anthropic
    max_tokens: 32768
    reasoning_effort: high
    max_retries: 1
    effort: high
  source_dir: ./harnesses/darwinx-claude_code-searchqa/target
  timeout: 600
  max_turns: 10
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
algorithm:
  name: darwinx
  worker:
    type: agent
    llm:
      model_name: deepseek-v4-pro
      base_url: https://api.deepseek.com/anthropic
      max_tokens: 65536
      reasoning_effort: high
      max_retries: 1
      effort: high
    name: claude_code
    timeout: 1200
    max_turns: 100
    source_dir: ../../flashrsi/agents/claude_code
  max_steps: 10
  max_evidence_chars: 24000
  screen_size: 10
  screen_samples: 1
  confirm_samples: 1
  merge_every: 3
  seed: 42
  regression_tolerance: 10.0
  gate_split: dev
  gate_fraction: 0.05
  hard_invariant_veto: false
