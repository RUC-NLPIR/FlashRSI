# Copy to a sibling *.local.yaml so relative paths keep their meaning.
# Fill Target/Worker model settings and every extra role/service below.
# Natural Questions with supplied context and local answer scoring; no external search service.
# 1/1/1 is a custom experiment partition, not an official benchmark result.
run:
  output_dir: ../runs
benchmark:
  name: nq
  seed: 42
  split_counts:
    train: 1
    dev: 1
    test: 1
agent:
  name: miniagent
  max_turns: 3
  timeout: 180
  llm:
    model_name: null
    api_key: null
    base_url: null
algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  worker:
    type: llm
    timeout: 300
    llm:
      model_name: null
      api_key: null
      base_url: null
