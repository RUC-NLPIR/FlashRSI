# Run through scripts/run_searchqa_experiment.py, which injects local credentials.
run:
  output_dir: ../../runs/searchqa-deepseek
benchmark:
  name: searchqa
  split: auto
  seed: 42
agent:
  name: miniagent
  timeout: 300
  max_turns: 10
  llm:
    model_name: deepseek-v4-flash
    api_key: null
    base_url: null
    max_tokens: 16384
    reasoning_effort: high
    llm_max_retries: 1
algorithm:
  name: skillopt
  num_epochs: 4
  batch_size: 40
  reflection_minibatch_size: 8
  merge_batch_size: 8
  edit_budget: 4
  seed: 42
  max_steps: null
  use_slow_update: true
  use_meta_skill: true
  slow_update_samples: 20
  worker:
    type: llm
    timeout: 600
    max_retries: 1
    llm:
      model_name: deepseek-v4-pro
      api_key: null
      base_url: null
      max_tokens: 32768
      reasoning_effort: high
