# Pi target example. The pure-Python Pi runtime is pinned in the Agent Snapshot.
# No Node.js, npm, or globally installed Pi CLI is required.
# Pi model names use provider/model, for example openai/gpt-5.
run:
  output_dir: ../runs

benchmark:
  name: searchqa
  data_path: ./examples/data/quickstart.jsonl
  split:
    train: 0.5
    dev: 0.25
    test: 0.25
  seed: 42

agent:
  name: pi
  timeout: 300
  llm:
    model_name: openai/your-model
    api_key: null
    base_url: null

algorithm:
  name: skillopt
  num_epochs: 1
  max_steps: 1
  batch_size: 2
  edit_budget: 1
  worker:
    type: llm
    llm:
      model_name: your-worker-model
      api_key: null
      base_url: null
