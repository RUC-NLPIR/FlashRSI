# Copy to ../twowiki_multihopqa.local.yaml, then fill both model configurations.
run:
  output_dir: ./runs

benchmark:
  name: twowiki_multihopqa
  mode: context
  scoring: answer_text
  seed: 42
  # Explicit CUSTOM partition of the labeled upstream train/validation pool.
  # This is a small experiment, not an official held-out test evaluation.
  split_counts: {train: 16, dev: 8, test: 6}

agent:
  name: miniagent
  max_turns: 3
  timeout: 180
  llm:
    model_name:
    api_key:
    base_url:
    max_tokens: 4096

algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  few_shot_size: 3
  seed: 42
  worker:
    type: llm
    timeout: 180
    llm:
      model_name:
      api_key:
      base_url:
      max_tokens: 4096
