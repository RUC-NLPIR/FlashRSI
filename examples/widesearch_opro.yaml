# Copy to a sibling *.local.yaml so relative paths keep their meaning.
# Fill Target/Worker model settings and every extra role/service below.
# Fill Serper/Jina keys in YAML and the independent Judge. Search services can be changed; see docs/web-research-services.md.
# 1/1/1 is a custom experiment partition, not an official benchmark result.
run:
  output_dir: ../runs
benchmark:
  name: widesearch
  seed: 42
  split_counts:
    train: 1
    dev: 1
    test: 1
  retrieval:
    provider: serper
    api_key: null
    reader:
      provider: jina
      api_key: null
  judge:
    llm:
      model_name: gpt-4.1-2025-04-14
      api_key: null
      base_url: null
agent:
  name: miniagent
  max_turns: 40
  timeout: 1200
  llm:
    model_name: null
    api_key: null
    base_url: null
algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  worker:
    type: llm
    timeout: 300
    llm:
      model_name: null
      api_key: null
      base_url: null
