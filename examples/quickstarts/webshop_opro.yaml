# HF task membership; full native WebShop resources are prepared separately.
# native_root/native_python are relative to the launch working directory.
run:
  output_dir: "../../runs"
benchmark:
  name: webshop
  dataset:
    source: RUC-NLPIR/FlashRSI
    config: webshop
    revision: 3d89e1589deeb3215c468849ba1b268beb9b0eba
  native_root: /path/to/WebShop
  native_python: /path/to/webshop-env/bin/python
  seed: 42
  max_steps: 100
  # Remove limit to use all 150 / 75 / 150 published tasks.
  limit: 3
agent:
  name: miniagent
  max_turns: 110
  timeout: 1200
  llm:
    model_name: your-target-model
    base_url: https://api.deepseek.com/v1
    api_key:
algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  worker:
    type: llm
    timeout: 180
    llm:
      model_name: your-worker-model
      base_url: https://api.deepseek.com/v1
      api_key:
