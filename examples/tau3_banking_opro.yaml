# Copy to a sibling *.local.yaml so relative paths keep their meaning.
# Fill Target/Worker model settings and every extra role/service below.
# Native tau2 banking with BM25 retrieval, Python 3.12/3.13. Configure User Simulator independently.
# 1/1/1 is a custom experiment partition, not an official benchmark result.
run:
  output_dir: ../runs
benchmark:
  name: tau3_banking
  seed: 42
  split_counts:
    train: 1
    dev: 1
    test: 1
  variant: bm25
  user_simulator:
    llm:
      model_name: null
      api_key: null
      base_url: null
agent:
  name: miniagent
  max_turns: 3
  timeout: 1200
  llm:
    model_name: null
    api_key: null
    base_url: null
  max_steps: 100
algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  worker:
    type: llm
    timeout: 300
    llm:
      model_name: null
      api_key: null
      base_url: null
