# Copy to ../tau2.local.yaml and fill Target, Worker and User Simulator independently.
run:
  output_dir: ./runs
benchmark:
  name: tau2
  domain: telecom
  mode: text
  task_split: train
  seed: 42
  # Experiment partitions use only native train; native test stays untouched.
  split_counts: {train: 4, dev: 2, test: 2}
  user_simulator:
    llm:
      model_name:
      api_key:
      base_url:
      temperature: 0.0
      timeout: 120
agent:
  name: miniagent
  max_turns: 3
  max_steps: 40
  timeout: 180
  llm:
    model_name:
    api_key:
    base_url:
    max_tokens: 4096
algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  few_shot_size: 3
  seed: 42
  worker:
    type: llm
    timeout: 180
    llm:
      model_name:
      api_key:
      base_url:
      max_tokens: 4096
