# Copy to a sibling *.local.yaml and fill the two independent model roles.
# Published HF membership is preserved; limit only samples within each role.
run:
  output_dir: ../runs
benchmark:
  name: hotpotqa
  dataset:
    source: RUC-NLPIR/FlashRSI
    revision: 8e226b748e648d4e001cf247f255cfb9eb752292
    config: hotpotqa
  split: auto
  limit: 15
  seed: 42
agent:
  name: miniagent
  max_turns: 10
  timeout: 300
  llm:
    model_name: null
    api_key: null
    base_url: null
algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  few_shot_size: 1
  seed: 42
  worker:
    type: llm
    timeout: 180
    llm:
      model_name: null
      api_key: null
      base_url: null
