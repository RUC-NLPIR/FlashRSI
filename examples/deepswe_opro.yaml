# Interface example only; no experiment was run during integration.
# Copy to the project root; configure Target and Worker independently.
# These are custom experiment partitions, not official leaderboard splits.
run:
  output_dir: ./runs
benchmark:
  name: deepswe
  # Optional: native checkout, tasks/ directory, or one task directory.
  # data_path: ./data/deep-swe
  seed: 42
  split_counts:
    train: 1
    dev: 1
    test: 1
agent:
  name: miniagent
  max_turns: 60
  timeout: 1800
  llm:
    model_name: null
    api_key: null
    base_url: https://api.openai.com/v1 # Set the actual Target model endpoint.
    max_tokens: 4096
algorithm:
  name: opro
  max_steps: 1
  num_candidates: 1
  few_shot_size: 1
  seed: 42
  worker:
    type: llm
    timeout: 180
    llm:
      model_name: null
      api_key: null
      base_url: null
      max_tokens: 4096
