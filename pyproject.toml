[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashrsi-lite"
version = "0.1.0"
description = "A minimal framework for reproducible agent evolution"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "datasets>=3,<5"]

[project.scripts]
flashrsi = "flashrsi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
miniagent = ["openai>=2,<3", "requests>=2.32,<3"]
claude-code = ["claude-agent-sdk>=0.2.153,<0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flashrsi*"]

[tool.setuptools.package-data]
"flashrsi.agents.miniagent" = ["*.yaml", "**/*.md", "**/*.json", "**/*.yaml"]
"flashrsi.agents.claude_code" = ["*.yaml", "*.md", "settings.json", ".mcp.json", ".lsp.json", ".claude-plugin/*.json", "skills/**/*", "commands/**/*", "agents/**/*", "hooks/**/*", "servers/**/*", "output-styles/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
extend-exclude = ["mvp_doc.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
