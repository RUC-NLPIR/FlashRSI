[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashrsi-lite"
version = "0.1.0"
description = "A minimal framework for reproducible agent evolution"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
    "datasets>=3,<5",
    "openai>=2,<3",
    "requests>=2.32,<3",
    "claude-agent-sdk>=0.2.153,<0.3",
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "tree-sitter==0.25.2",
    "tree-sitter-bash==0.25.1",
    "packaging>=24",
    "rank_bm25>=0.2,<1",
]

[project.scripts]
flashrsi = "flashrsi.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
llm = ["openai>=2,<3"]
miniagent = ["openai>=2,<3", "requests>=2.32,<3"]
claude-code = ["claude-agent-sdk>=0.2.153,<0.3"]
codex = [
    "httpx>=0.28,<1",
    "pillow>=11,<13",
    "tree-sitter==0.25.2",
    "tree-sitter-bash==0.25.1",
]
codex-oracle = ["openai-codex-cli-bin==0.147.0"]
harbor = ["harbor==0.23.0; python_version >= '3.12'", "packaging>=24"]
# tau2-bench is not published on PyPI, so it cannot be a dependency here.
# Install it alongside this package, in its own environment:
#   uv pip install "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@v1.0.1" rank_bm25
# It pins litellm<1.82.7 while harbor requires >=1.92.0, so the two
# environment integrations cannot share one environment.
tau2 = ["rank_bm25>=0.2,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flashrsi*"]
# Reference sources and bundled skill scripts are data. Treating those scripts
# as namespace packages strips upstream executable bits during build_py.
exclude = [
    "flashrsi.agents.codex.runtime*",
    "flashrsi.agents.codex._bridge*",
    "flashrsi.agents.codex.python_core.resource_assets.system_skills*",
]

[tool.setuptools.package-data]
"flashrsi.agents.miniagent" = ["*.yaml", "**/*.md", "**/*.json", "**/*.yaml"]
"flashrsi.agents.claude_code" = ["*.yaml", "*.md", "settings.json", ".mcp.json", ".lsp.json", ".claude-plugin/*.json", "skills/**/*", "commands/**/*", "agents/**/*", "hooks/**/*", "servers/**/*", "output-styles/**/*"]
"flashrsi.agents.codex" = ["components.yaml", "config.toml", "AGENTS.md", "skills/**/*", "rules/**/*", "agents/**/*", "hooks/**/*", "servers/**/*", "plugins/**/*", "memories/**/*", "python_core/**/*"]

[tool.setuptools.exclude-package-data]
"flashrsi.agents.codex" = ["runtime/*", "runtime/**/*", "_bridge/*", "_bridge/**/*", "_companion.json", "**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
extend-exclude = ["mvp_doc.md", "flashrsi/agents/codex/runtime", "flashrsi/agents/codex/python_core/resource_assets/system_skills"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
